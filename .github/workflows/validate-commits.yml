name: "Validate Commit Messages"

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          echo "🔍 Fetching PR commits..."
          commits=$(git log origin/${{ github.event.pull_request.base.ref }}..HEAD --pretty=format:"%s")

          regex="^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([a-z0-9\-]+\))?: .+"

          invalid_commits=""

          while IFS= read -r commit; do
            if ! [[ $commit =~ $regex ]]; then
              invalid_commits+="$commit\n"
            fi
          done <<< "$commits"

          if [ -n "$invalid_commits" ]; then
            echo "❌ The following commit(s) do not follow Conventional Commit format:"
            echo -e "$invalid_commits"
            exit 1
          else
            echo "✅ All commit messages follow Conventional Commit format."
          fi
